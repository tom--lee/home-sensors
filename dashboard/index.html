<!DOCTYPE html>

<meta charset="UTF-8">

<html>

<head>
  <title>Current Time</title>
  <style>
    body {
      color: #e36464;
      background-color: black;
    }

    #date {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 20%;
      font-size: 4.5vw;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Consolas", "Courier New", monospace;
      font-weight: 500;
    }

    #time {
      position: absolute;
      top: 20%;
      left: 0;
      width: 100%;
      height: 40%;
      font-size: 13vw;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Consolas", "Courier New", monospace;
      font-weight: 500;
    }

    #temps {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50%;
      height: 50%;
      font-size: 5.5vw;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 1vw;
      padding: 0 2vw 2vw 2vw;
      box-sizing: border-box;
      font-family: "Consolas", "Courier New", monospace;
      font-weight: 500;
    }

    #temps > span {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 0.3em;
    }

    #solar {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 50%;
      height: 50%;
      font-size: 5.5vw;
      display: grid;
      grid-template-columns: auto auto 1.5em;
      column-gap: 0.3em;
      align-content: space-around;
      align-items: center;
      padding: 0 2vw 0 2vw;
      box-sizing: border-box;
      font-family: "Consolas", "Courier New", monospace;
      font-weight: 500;
    }

    .solar-kw  { text-align: right; white-space: nowrap; }
    .solar-pv  { color: #64c864; }
    .solar-grid { color: #e36464; }
    .solar-batt-kw  { color: #6496e3; }
    .solar-batt-soc { color: #6496e3; padding-left: 0.5em; }
    .solar-load { color: #e3a864; }

    #stale {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 5vw;
      padding: 0.5vw 1vw;
      display: none;
    }
  </style>
</head>

<body>
  <span id="stale">⚠</span>
  <span id="date"></span>
  <span id="time"></span>
  <div id="temps">
    <span id="temperature"></span>
    <span id="bom-temperature"></span>
  </div>
  <div id="solar"></div>

  <script>

    const host = "ampere.local"
    const port = "8000"

    //import  {pad} from pad

    function format_time(time) {
      const hours24 = time.getHours()
      const hours = hours24 % 12
      const formatted_hours = (hours === 0 ? 12 : hours).toString().padStart(2, ' ');
      const formatted_minutes = time.getMinutes().toString().padStart(2, '0');
      return formatted_hours + ":" + formatted_minutes
    }

    const days = [
      "Sunday",
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
    ];

    const months = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December"
    ];

    function format_date(current_time) {
      const day = days[current_time.getDay()];
      const dayOfMonth = current_time.getDate().toString();
      const suffix = {
        "1": "st",
        "2": "nd",
        "3": "rd",
        "21": "st",
        "22": "nd",
        "23": "rd",
        "31": "st",
      }[dayOfMonth] ?? 'th'
      const month = months[current_time.getMonth()];
      const text = format_time(current_time);
      return `${day} ${dayOfMonth}${suffix} ${month}`; 
    }

    function update_time() {
      const current_time = new Date();
      const month = months[current_time.getMonth()];
      document.getElementById("date").innerHTML = format_date(current_time)
      document.getElementById("time").innerHTML = format_time(current_time)
    }

    // Call the function once to display the time immediately
    update_time();

    // Update the time every second
    setInterval(update_time, 1000);


    //import  {pad} from pad

    function format_temperature(temperature) {
      return temperature + "°C"
    }

    async function get_sensor_data(locationId) {
      const url = host
      const response = await fetch(`${locationId}/latest`)
      if (!response.ok) {
        return response.status
      }
      const responseBody = await response.text();
      console.log(responseBody)
      return JSON.parse(responseBody);
    }

    const STALE_MS = 6 * 60 * 1000
    const staleState = {}

    function checkStale(source, timestamp) {
      if (!timestamp) { staleState[source] = true; return }
      staleState[source] = (Date.now() - new Date(timestamp).getTime()) > STALE_MS
      document.getElementById("stale").style.display =
        Object.values(staleState).some(v => v) ? 'block' : 'none'
    }

    async function update_temperature() {
      try {
        const data = await get_sensor_data('living-room')
        if (!data.value) return
        checkStale('living-room', data.timestamp)
        const temperature = parseFloat(data.value.split('_')[0])
        if (isNaN(temperature)) return
        document.getElementById("temperature").innerHTML = `<span>🏠</span><span>${format_temperature(temperature)}</span>`;
      } catch (e) { console.log("temperature fetch failed", e) }
    }

    async function update_bom_temperature() {
      try {
        const data = await get_sensor_data('bom')
        if (!data.value) return
        const temperature = parseFloat(data.value)
        if (isNaN(temperature)) return
        document.getElementById("bom-temperature").innerHTML = `<span>🌳</span><span>${format_temperature(temperature)}</span>`;
      } catch (e) { console.log("bom fetch failed", e) }
    }

    const SOLAR_FIELDS = [
      "pv_w", "batt_soc", "batt_v", "batt_w", "grid_import_w", "grid_export_w",
      "load_w", "pv_today_kwh", "pv_total_kwh", "load_today_kwh",
      "load_total_kwh", "imp_today_kwh", "imp_total_kwh",
      "exp_today_kwh", "exp_total_kwh"
    ];

    async function update_solar() {
      const data = await get_sensor_data('solar')
      if (!data.value) return
      checkStale('solar', data.timestamp)
      const vals = data.value.split('_').map(Number)
      const solar = Object.fromEntries(SOLAR_FIELDS.map((k, i) => [k, vals[i]]))
      const sign = v => v >= 0 ? '+' : ''
      const net_grid = solar.grid_import_w - solar.grid_export_w
      const row = (icon, kw, extra='') =>
        `<span>${extra}</span><span class="solar-kw">${kw}</span><span>${icon}</span>`
      document.getElementById("solar").innerHTML =
        row('🔌', `<span class="solar-load">${(solar.load_w / 1000).toFixed(1)} kW</span>`) +
        row('☀',  `<span class="solar-pv">${(solar.pv_w / 1000).toFixed(1)} kW</span>`) +
        row('🔋', `<span class="solar-batt-kw">${sign(solar.batt_w)}${(solar.batt_w / 1000).toFixed(1)} kW</span>`,
                  `<span class="solar-batt-soc">${Math.round(solar.batt_soc)}%</span>`) +
        row('⚡', `<span class="solar-grid">${sign(net_grid)}${(net_grid / 1000).toFixed(1)} kW</span>`)
    }

    // Call the function once to display the time immediately
    update_temperature();
    update_bom_temperature();
    update_solar();

    // Update the temperature every minute
    setInterval(update_bom_temperature, 60000);
    setInterval(update_temperature, 10000);
    setInterval(update_solar, 60000);
  </script>
</body>

</html>
